<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over 2.5 — Análise do Modelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #0A0F0C;
    --panel: #111813;
    --panel-2: #0D1310;
    --line: #1E2A22;
    --line-soft: #172019;
    --text: #E9EDE7;
    --text-muted: #7C8A7E;
    --text-dim: #4E5B50;
    --green: #43D17A;
    --green-dim: #1F4A31;
    --amber: #F5A623;
    --amber-dim: #4A3A16;
    --red: #E85C4A;
    --red-dim: #4A241E;
    --grey-sig: #5B6A5D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 48px 48px;
    background-attachment: fixed;
    min-height: 100vh;
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ===================== HEADER ===================== */

  header {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10,15,12,0.95), rgba(10,15,12,0.75));
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    background: var(--green);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 10px var(--green);
    transform: translateY(-1px);
  }

  .brand h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .brand .market {
    color: var(--text-muted);
    font-size: 13px;
  }

  #last-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ===================== SCOREBOARD ===================== */

  .scoreboard {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .score-cell {
    background: var(--panel);
    padding: 20px 16px;
    text-align: center;
  }

  .score-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .score-value.green { color: var(--green); }
  .score-value.amber { color: var(--amber); }
  .score-value.pos { color: var(--green); }
  .score-value.neg { color: var(--red); }

  .score-label {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  @media (max-width: 700px) {
    .scoreboard { grid-template-columns: repeat(2, 1fr); margin: 0 16px; padding-top: 24px; }
    .score-value { font-size: 26px; }
  }

  /* ===================== CONTROLS ===================== */

  .controls {
    max-width: 1100px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }

  .filter-btn.active {
    background: var(--panel);
    border-color: var(--green);
    color: var(--green);
  }

  .search-box {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    padding: 8px 14px;
    width: 220px;
    outline: none;
  }

  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { border-color: var(--text-dim); }

  /* ===================== MATCH LIST ===================== */

  .match-list {
    max-width: 1100px;
    margin: 20px auto 60px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .match-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--grey-sig);
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1.6fr 1.4fr 1fr auto;
    align-items: center;
    gap: 20px;
  }

  .match-row.sig-ACERTO { border-left-color: var(--green); }
  .match-row.sig-ERRO { border-left-color: var(--red); }
  .match-row.sig-DUVIDA { border-left-color: var(--amber); }
  .match-row.sig-PENDENTE { border-left-color: var(--grey-sig); }

  .competicao-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .col-teams .teams {
    font-size: 15px;
    font-weight: 600;
  }

  .col-teams .datetime {
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .col-xg { font-size: 12.5px; color: var(--text-muted); }

  .col-xg .xg-formula {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }

  .prob-wrap { margin-top: 6px; }

  .prob-track {
    height: 4px;
    background: var(--line);
    width: 100%;
    max-width: 140px;
    position: relative;
  }

  .prob-fill {
    height: 100%;
    background: var(--green);
  }

  .prob-label {
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .col-odds {
    text-align: right;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .col-odds .odd-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
  }

  .col-odds .ev {
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
  }

  .ev.pos { color: var(--green); }
  .ev.neg { color: var(--red); }

  .col-badge {
    text-align: right;
  }

  .badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid;
    white-space: nowrap;
  }

  .badge-ACERTO { color: var(--green); border-color: var(--green-dim); background: rgba(67,209,122,0.06); }
  .badge-ERRO { color: var(--red); border-color: var(--red-dim); background: rgba(232,92,74,0.06); }
  .badge-DUVIDA { color: var(--amber); border-color: var(--amber-dim); background: rgba(245,166,35,0.06); }
  .badge-PENDENTE { color: var(--text-muted); border-color: var(--line); background: transparent; }

  .result-tag {
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (max-width: 800px) {
    .match-row {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .col-odds, .col-badge { text-align: left; }
    .prob-track { max-width: 100%; }
  }

  /* ===================== STATES ===================== */

  .state-box {
    max-width: 1100px;
    margin: 60px auto;
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  .state-box .state-title {
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .state-box code {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 2px 6px;
    color: var(--amber);
  }

  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Análise do Modelo</h1>
      <span class="market">— Mercado Over 2.5</span>
    </div>
    <div id="last-updated">a carregar…</div>
  </div>
</header>

<div class="scoreboard" id="scoreboard">
  <div class="score-cell">
    <div class="score-value mono" id="stat-jogos">—</div>
    <div class="score-label">Jogos analisados</div>
  </div>
  <div class="score-cell">
    <div class="score-value mono" id="stat-pendentes">—</div>
    <div class="score-label">Pendentes</div>
  </div>
  <div class="score-cell">
    <div class="score-value mono" id="stat-finalizados">—</div>
    <div class="score-label">Finalizados</div>
  </div>
  <div class="score-cell">
    <div class="score-value green mono" id="stat-acerto">—</div>
    <div class="score-label">Taxa de acerto</div>
  </div>
</div>

<div class="controls">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="ALL">Todos</button>
    <button class="filter-btn" data-filter="PENDENTE">Pendentes</button>
    <button class="filter-btn" data-filter="ACERTO">Acertos</button>
    <button class="filter-btn" data-filter="DUVIDA">Dúvida</button>
    <button class="filter-btn" data-filter="ERRO">Erros</button>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <select class="search-box" id="competicao-select" style="width:auto;">
      <option value="ALL">Todas as competições</option>
    </select>
    <input type="text" class="search-box" id="search" placeholder="Procurar equipa…">
  </div>
</div>

<div class="match-list" id="match-list"></div>

<footer>
  fonte: analise_modelo.csv · atualiza sempre que o ficheiro é atualizado no GitHub
</footer>

<script>

  // ============================================================
  // CONFIGURAÇÃO — muda apenas isto
  // ============================================================
  //
  // Coloca aqui o link "raw" do teu historico_bot.csv no GitHub.
  // Exemplo:
  // https://raw.githubusercontent.com/TEUUSER/TEUREPO/main/historico_bot.csv
  //
  const CONFIG = {
    // Caminho relativo: funciona automaticamente quando o index.html
    // e o analise_modelo.csv estão na mesma pasta do mesmo repositório
    // no GitHub Pages. Só precisas de mudar isto se guardares o CSV
    // noutro sítio (ex: outro repositório).
    csvUrl: "analise_modelo.csv",
    delimiter: ";",
    refreshMinutes: 5
  };

  const NOME_COMPETICAO = {
    "PPL": "Primeira Liga",
    "PL": "Premier League",
    "PD": "La Liga",
    "SA": "Serie A",
    "BL1": "Bundesliga",
    "FL1": "Ligue 1"
  };

  // ============================================================
  // PARSE DO CSV (delimitador ";", com BOM utf-8-sig)
  // ============================================================

  function detectarDelimitador(headerLine) {
    const candidatos = [";", "\t", ","];
    let melhor = ";";
    let maxCount = -1;
    candidatos.forEach(d => {
      const count = headerLine.split(d).length;
      if (count > maxCount) {
        maxCount = count;
        melhor = d;
      }
    });
    return melhor;
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, "").trim();
    if (!text) return [];

    const lines = text.split(/\r?\n/).filter(l => l.length > 0);
    if (lines.length < 2) return [];

    const delimitador = detectarDelimitador(lines[0]);
    const headers = lines[0].split(delimitador).map(h => h.trim());

    return lines.slice(1).map(line => {
      const cells = line.split(delimitador);
      const row = {};
      headers.forEach((h, i) => {
        row[h] = (cells[i] || "").trim();
      });
      return row;
    });
  }

  function toNumber(v) {
    if (v === undefined || v === null || v === "") return null;
    const n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? null : n;
  }

  function fmt(n, decimals) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    return n.toFixed(decimals);
  }

  function formatDateTime(str) {
    if (!str) return "";
    const [datePart, timePart] = str.split(" ");
    if (!datePart) return str;

    let d, m, y;

    if (datePart.includes("/")) {
      // DD/MM/YYYY
      [d, m, y] = datePart.split("/");
    } else {
      // YYYY-MM-DD
      [y, m, d] = datePart.split("-");
    }

    const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    const mesIdx = parseInt(m, 10) - 1;
    const mesNome = meses[mesIdx] || m;
    return `${d} ${mesNome} · ${timePart || ""}`.trim();
  }

  function dataParaOrdenacao(str) {
    // Devolve um valor comparável (YYYYMMDDHHMM) independentemente
    // do formato original ser DD/MM/YYYY ou YYYY-MM-DD.
    if (!str) return "";
    const [datePart, timePart] = str.split(" ");
    if (!datePart) return str;

    let d, m, y;
    if (datePart.includes("/")) {
      [d, m, y] = datePart.split("/");
    } else {
      [y, m, d] = datePart.split("-");
    }

    return `${y}${m}${d}${(timePart || "").replace(":", "")}`;
  }

  // ============================================================
  // ESTADO
  // ============================================================

  let allRows = [];
  let currentFilter = "ALL";
  let currentSearch = "";
  let currentCompeticao = "ALL";

  // ============================================================
  // RENDER — SCOREBOARD
  // ============================================================

  function classificarPrevisao(row) {
    // Lê diretamente a coluna "Resultado", que o atualizar_resultados.py
    // já preenche com PENDENTE / CORRETO / ERRADO / ERRADO - DÚVIDA.
    const resultado = (row["Resultado"] || "").trim().toUpperCase();

    if (resultado === "CORRETO") return "ACERTO";
    if (resultado === "ERRADO - DÚVIDA" || resultado === "ERRADO - DUVIDA") return "DUVIDA";
    if (resultado === "ERRADO") return "ERRO";
    return "PENDENTE";
  }

  function renderScoreboard(rows) {
    const totalJogos = rows.length;
    const acertos = rows.filter(r => classificarPrevisao(r) === "ACERTO").length;
    const erros = rows.filter(r => classificarPrevisao(r) === "ERRO").length;
    const duvidas = rows.filter(r => classificarPrevisao(r) === "DUVIDA").length;
    const pendentes = rows.filter(r => classificarPrevisao(r) === "PENDENTE").length;
    const finalizados = acertos + erros + duvidas;

    const taxaAcerto = (acertos + erros) > 0 ? (acertos / (acertos + erros)) * 100 : null;

    document.getElementById("stat-jogos").textContent = totalJogos;
    document.getElementById("stat-pendentes").textContent = pendentes;
    document.getElementById("stat-finalizados").textContent = finalizados;

    const acertoEl = document.getElementById("stat-acerto");
    acertoEl.textContent = taxaAcerto !== null ? `${fmt(taxaAcerto, 1)}%` : "—";
  }

  function popularCompeticoes(rows) {
    const select = document.getElementById("competicao-select");
    const atuais = new Set(Array.from(select.options).map(o => o.value));
    const competicoes = Array.from(new Set(rows.map(r => r["Competicao"]).filter(Boolean))).sort();

    competicoes.forEach(cod => {
      if (atuais.has(cod)) return;
      const opt = document.createElement("option");
      opt.value = cod;
      opt.textContent = NOME_COMPETICAO[cod] || cod;
      select.appendChild(opt);
    });
  }

  // ============================================================
  // RENDER — LISTA DE JOGOS
  // ============================================================

  function renderList() {
    const container = document.getElementById("match-list");
    container.innerHTML = "";

    let rows = allRows;

    if (currentFilter !== "ALL") {
      rows = rows.filter(r => classificarPrevisao(r) === currentFilter);
    }

    if (currentCompeticao !== "ALL") {
      rows = rows.filter(r => r["Competicao"] === currentCompeticao);
    }

    if (currentSearch.trim() !== "") {
      const q = currentSearch.trim().toLowerCase();
      rows = rows.filter(r =>
        (r["Casa"] || "").toLowerCase().includes(q) ||
        (r["Fora"] || "").toLowerCase().includes(q)
      );
    }

    // mais recentes primeiro (por Data Jogo)
    rows = rows.slice().sort((a, b) => {
      return dataParaOrdenacao(b["Data Jogo"]).localeCompare(dataParaOrdenacao(a["Data Jogo"]));
    });

    if (allRows.length === 0) {
      container.innerHTML = `
        <div class="state-box">
          <div class="state-title">Ainda sem previsões registadas</div>
          <div>Assim que o bot gravar a primeira linha em <code>analise_modelo.csv</code>, ela aparece aqui.</div>
        </div>`;
      return;
    }

    if (rows.length === 0) {
      container.innerHTML = `
        <div class="state-box">
          <div class="state-title">Nada encontrado</div>
          <div>Experimenta outro filtro ou termo de pesquisa.</div>
        </div>`;
      return;
    }

    rows.forEach(row => {
      const classificacao = classificarPrevisao(row);
      const xgCasa = toNumber(row["Expected Golos Casa"]);
      const xgFora = toNumber(row["Expected Golos Fora"]);
      const xgTotal = toNumber(row["Expected Golos Total"]);
      const probRaw = toNumber(row["Probabilidade Over 2.5"]);
      const prob = probRaw !== null ? probRaw * 100 : null;
      const ev = toNumber(row["EV PCT"]);
      const oddOver = toNumber(row["Odd Over 2.5"]);
      const oddJusta = toNumber(row["Odd Justa"]);
      const competicao = NOME_COMPETICAO[row["Competicao"]] || row["Competicao"] || "";

      const el = document.createElement("div");
      el.className = `match-row sig-${classificacao}`;

      const probPct = prob !== null ? Math.min(100, Math.max(0, prob)) : 0;
      const evClass = ev !== null && ev >= 0 ? "pos" : "neg";
      const evSign = ev !== null && ev >= 0 ? "+" : "";

      const badgeInfo = {
        "PENDENTE": { label: "PENDENTE" },
        "ACERTO": { label: "✔ ACERTO" },
        "DUVIDA": { label: "~ DÚVIDA" },
        "ERRO": { label: "✘ ERRO" }
      }[classificacao];

      let resultLine = "";
      if (row["Golos Casa Reais"] !== "" && row["Golos Fora Reais"] !== "") {
        const gc = row["Golos Casa Reais"];
        const gf = row["Golos Fora Reais"];
        resultLine = `<div class="result-tag">resultado ${gc}-${gf}</div>`;
      }

      el.innerHTML = `
        <div class="col-teams">
          <div class="competicao-tag">${competicao}</div>
          <div class="teams">${row["Casa"] || "—"} vs ${row["Fora"] || "—"}</div>
          <div class="datetime">${formatDateTime(row["Data Jogo"])}</div>
        </div>
        <div class="col-xg">
          xG casa + fora
          <div class="xg-formula">${fmt(xgCasa,2)} + ${fmt(xgFora,2)} = ${fmt(xgTotal,2)}</div>
          ${prob !== null ? `
          <div class="prob-wrap">
            <div class="prob-track"><div class="prob-fill" style="width:${probPct}%"></div></div>
            <div class="prob-label">prob. over 2.5: ${fmt(prob,1)}%</div>
          </div>` : ""}
        </div>
        <div class="col-odds">
          odd / odd justa
          <div class="odd-line">${fmt(oddOver,2)} / ${fmt(oddJusta,2)}</div>
          <div class="ev ${evClass}">${ev !== null ? evSign + fmt(ev,1) + "% EV" : "—"}</div>
        </div>
        <div class="col-badge">
          <span class="badge badge-${classificacao}">${badgeInfo.label}</span>
          ${resultLine}
        </div>
      `;

      container.appendChild(el);
    });
  }

  // ============================================================
  // CARREGAR DADOS
  // ============================================================

  async function loadData() {
    const listEl = document.getElementById("match-list");

    if (!CONFIG.csvUrl || CONFIG.csvUrl.includes("COLOCA_AQUI")) {
      listEl.innerHTML = `
        <div class="state-box">
          <div class="state-title">Falta configurar a fonte de dados</div>
          <div>Abre o <code>index.html</code> e define <code>CONFIG.csvUrl</code> com o link "raw" do teu <code>analise_modelo.csv</code> no GitHub.</div>
        </div>`;
      return;
    }

    try {
      const url = CONFIG.csvUrl + (CONFIG.csvUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const text = await res.text();
      allRows = parseCSV(text);

      renderScoreboard(allRows);
      popularCompeticoes(allRows);
      renderList();

      document.getElementById("last-updated").textContent =
        "atualizado " + new Date().toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });

    } catch (err) {
      listEl.innerHTML = `
        <div class="state-box">
          <div class="state-title">Não foi possível carregar o histórico</div>
          <div>Confirma que o ficheiro <code>${CONFIG.csvUrl}</code> está na mesma pasta deste <code>index.html</code>, no mesmo repositório.<br>Erro: ${err.message}</div>
        </div>`;
    }
  }

  // ============================================================
  // EVENTOS
  // ============================================================

  document.getElementById("filters").addEventListener("click", (e) => {
    if (!e.target.classList.contains("filter-btn")) return;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.filter;
    renderList();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    currentSearch = e.target.value;
    renderList();
  });

  document.getElementById("competicao-select").addEventListener("change", (e) => {
    currentCompeticao = e.target.value;
    renderList();
  });

  loadData();
  setInterval(loadData, CONFIG.refreshMinutes * 60 * 1000);

</script>

</body>
</html>
